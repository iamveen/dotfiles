- name: Ubuntu base setup
  hosts: all
  become: true

  tasks:
    - name: Install stow
      apt:
        name: stow
        state: present

    - name: Install mise
      become: false
      ansible.builtin.shell: |
        if ! command -v mise &>/dev/null; then
          curl https://mise.run | sh
        fi
      args:
        creates: "{{ ansible_user_dir }}/.local/bin/mise"

- name: Ubuntu base setup
  hosts: all
  become: true

  tasks:
    - name: Install system prerequisites
      apt:
        name:
          - git
          - curl
          - build-essential
          - unzip
          - unattended-upgrades
          - tree
          - entr
          - pkg-config
          - libssl-dev
        state: present
        update_cache: yes

    - name: Enable unattended upgrades
      systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    - name: Install stow
      apt:
        name: stow
        state: present

    - name: Install mise
      become: false
      ansible.builtin.shell: curl https://mise.run | sh
      args:
        creates: "~/.local/bin/mise"

    # ── Fish shell ──────────────────────────────────────────────────────────
    - name: Add Fish PPA
      ansible.builtin.apt_repository:
        repo: ppa:fish-shell/release-4
        state: present
        update_cache: yes

    - name: Install fish
      apt:
        name: fish
        state: present

    - name: Set fish as default shell for the current user
      ansible.builtin.user:
        name: "{{ lookup('env', 'USER') }}"
        shell: /usr/bin/fish

    # ── Nushell ─────────────────────────────────────────────────────────────
    - name: Add Nushell GPG key
      ansible.builtin.shell: wget -qO- https://apt.fury.io/nushell/gpg.key | gpg --dearmor -o /etc/apt/keyrings/fury-nushell.gpg
      args:
        creates: /etc/apt/keyrings/fury-nushell.gpg

    - name: Add Nushell apt repository
      ansible.builtin.apt_repository:
        repo: deb [signed-by=/etc/apt/keyrings/fury-nushell.gpg] https://apt.fury.io/nushell/ /
        state: present
        update_cache: yes

    - name: Install nushell
      apt:
        name: nushell
        state: present

    # ── Docker ───────────────────────────────────────────────────────────────
    - name: Install Docker prerequisites
      apt:
        name:
          - ca-certificates
          - gnupg
        state: present

    - name: Add Docker official GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker APT repository
      vars:
        docker_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts['architecture']] }}"
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ docker_arch }}
          signed-by=/etc/apt/keyrings/docker.gpg]
          https://download.docker.com/linux/ubuntu
          {{ ansible_facts['distribution_release'] }} stable
        state: present
        update_cache: yes

    - name: Install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
          - docker-model-plugin
        state: present
        update_cache: yes

    - name: Ensure Docker service is running
      systemd:
        name: docker
        enabled: yes
        state: started

    - name: Add user to the docker group
      ansible.builtin.user:
        name: "{{ lookup('env', 'USER') }}"
        groups: docker
        append: yes

    # ── Docker Agent ────────────────────────────────────────────────────────
    - name: Get latest docker-agent release from GitHub
      ansible.builtin.uri:
        url: https://api.github.com/repos/docker/docker-agent/releases/latest
        return_content: yes
      register: docker_agent_latest

    - set_fact:
        docker_agent_latest_version: "{{ docker_agent_latest.json.tag_name | regex_replace('^v', '') }}"

    - name: Check installed docker-agent version
      ansible.builtin.command: docker-agent version
      register: docker_agent_installed
      failed_when: false
      changed_when: false

    - name: Parse installed docker-agent version
      ansible.builtin.set_fact:
        docker_agent_installed_version: >-
          {{
            (docker_agent_installed.stdout | regex_findall('[0-9]+\.[0-9]+\.[0-9]+'))
            | default(['0.0.0'], true)
            | first
          }}

    - name: Determine if docker-agent needs updating
      set_fact:
        docker_agent_needs_update: >-
          {{ docker_agent_installed_version == '0.0.0'
             or docker_agent_installed_version is version(docker_agent_latest_version, '<') }}

    - name: Download docker-agent
      when: docker_agent_needs_update
      ansible.builtin.get_url:
        url: "https://github.com/docker/docker-agent/releases/latest/download/docker-agent-linux-{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_facts.architecture] }}"
        dest: /usr/local/bin/docker-agent
        mode: "0755"
        force: yes

    - name: Print docker-agent status
      ansible.builtin.debug:
        msg: >-
          {% if docker_agent_needs_update %}
            Installed docker-agent v{{ docker_agent_latest_version }}
          {% else %}
            docker-agent is up to date at v{{ docker_agent_installed_version }}
          {% endif %}

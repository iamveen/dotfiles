- name: Ubuntu base setup
  hosts: all
  become: true

  tasks:
    - name: Install system prerequisites
      apt:
        name:
          - git
          - curl
          - build-essential
          - unzip
          - unattended-upgrades
        state: present
        update_cache: yes

    - name: Enable unattended upgrades
      systemd:
        name: unattended-upgrades
        enabled: yes
        state: started

    - name: Install stow
      apt:
        name: stow
        state: present

    - name: Install mise
      become: false
      ansible.builtin.shell: |
        if ! command -v mise &>/dev/null; then
          curl https://mise.run | sh
        fi
      args:
        creates: "{{ ansible_user_dir }}/.local/bin/mise"

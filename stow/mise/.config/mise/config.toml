[env]
_.path = ["{{env.HOME}}/.dotfiles/bin"]
OPENSPEC_TELEMETRY = 0


# Secrets go in config.local.toml (gitignored)
# OPENROUTER_API_KEY = "{{env.OPENROUTER_API_KEY}}"

[tools]
# Languages / Runtimes
node = "24"                    # JavaScript runtime
ruby = "3"                    # Ruby language
rust = "1.94.1"               # Rust language

# Core CLI Tools
bat = "0.26.1"                # Syntax-highlighting cat
delta = "0.19.2"              # Syntax-highlighting git diff pager
eza = "0.23.4"                # Modern ls replacement
fd = "10.4.2"                 # Fast find alternative
jq = "1.8.1"                  # JSON processor
ripgrep = "15.1.0"            # Fast recursive regex grep
tree-sitter = "0.26.8"        # Incremental parsing library / CLI

# Terminal & TUI Apps
atuin = "18.15.2"
btop = "1.4.6"                # Resource monitor (CPU/mem/disk/net)
fzf = "0.71.0"                # Fuzzy finder for shell
lazydocker = "0.25.2"
lazygit = "0.61.1"
lazyjournal = "0.8.6"         # Journalctl TUI
neovim = "0.12.1"             # Modal text editor
tmux = "3.6a"                 # Terminal multiplexer
yazi = "26.1.22"              # Terminal file manager

# Git & Version Control
git-cliff = "2.12.0"          # Changelog generator from git tags
gitleaks = "8.30.1"           # Secret detection in git repos
jj = "0.40.0"                 # Git-compatible DVCS (Jujutsu)

# Security & Analysis
lychee = "0.23.0"             # Link checker for markdown/HTML
tokei = "14.0.0"              # Code statistics / LOC counter
trivy = "0.69.3"              # Container & dependency vulnerability scanner
vale = "3.14.1"               # Prose linter for style guides

# Markdown & Writing
glow = "2.1.2"                # Render markdown in the terminal
mermaid-ascii = "1.2.0"

# Language Packages (npm, gem, cargo)
"gem:try-cli" = "1.9.3"       # Ruby file organizer for try builds
"npm:@anthropic-ai/claude-code" = "2.1.116"
"npm:@mariozechner/pi-coding-agent" = "0.68.0"
zellij = "latest"             # Terminal multiplexer Rust alternative
"cargo:flowmark" = "latest"   # Markdown flowchart tool
prettier = "latest"           # Opinionated code formatter

# Code Search and Rewrite
"aqua:ast-grep/ast-grep" = "0.42.1"    # AST-based code search and rewrite

# Diff and Text Processing
"aqua:Wilfred/difftastic" = "0.68.0"   # Structural diff (language-aware)
"aqua:chmln/sd" = "1.1.0"              # Intuitive find and replace (sed alternative)
"aqua:mikefarah/yq" = "4.53.2"

# Shell Scripting
"aqua:koalaman/shellcheck" = "0.11.0" # Static shell script analysis

# Benchmarking and File Watching
"aqua:sharkdp/hyperfine" = "1.20.0"    # Command-line benchmarking tool
"aqua:watchexec/watchexec" = "2.5.1"   # Run commands on file changes
github-cli = "latest"
crush = "latest"
"pipx:git-filter-repo" = "latest"

[settings.ruby]
compile = false

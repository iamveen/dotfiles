[env]
_.path = ["{{env.HOME}}/.dotfiles/bin"]
OPENSPEC_TELEMETRY = 0

# Secrets go in config.local.toml (gitignored)
# OPENROUTER_API_KEY = "{{env.OPENROUTER_API_KEY}}"

[tools]
# Languages / Runtimes
node = "24"
ruby = "3"
rust = "1.94.1"

# Core CLI Tools
bat = "0.26.1"
delta = "0.19.2"
eza = "0.23.4"
fd = "10.4.2"
jq = "1.8.1"
ripgrep = "15.1.0"
tree-sitter = "0.26.8"

# Terminal & TUI Apps
atuin = "18.13.6"
btop = "1.4.6"
fzf = "0.71.0"
lazydocker = "0.25.0"
lazygit = "0.61.0"
lazyjournal = "0.8.6"
neovim = "0.12.1"
tmux = "3.6a"
yazi = "26.1.22"

# Git & Version Control
git-cliff = "2.12.0"
gitleaks = "8.30.1"
jj = "0.40.0"

# Security & Analysis
lychee = "0.23.0"
tokei = "14.0.0"
trivy = "0.69.3"
vale = "3.14.1"

# Markdown & Writing
glow = "2.1.2"
mermaid-ascii = "1.1.0"

# Language Packages (npm, gem)
"gem:try-cli" = "1.9.3"
"npm:@anthropic-ai/claude-code" = "2.1.108"
"npm:@mariozechner/pi-coding-agent" = "0.67.2"
zellij = "latest"
"cargo:flowmark" = "latest"
prettier = "latest"

[settings.ruby]
compile = false
